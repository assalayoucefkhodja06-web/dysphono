<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Dysphono</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
        .bg-pattern { background-image: radial-gradient(#0e8ce4 0.5px, transparent 0.5px); background-size: 20px 20px; opacity: 0.05; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl border border-white/50">
            <div class="flex flex-col items-center mb-6">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="p-2 bg-primary-600 rounded-xl">
                        <i data-lucide="mic-2" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="text-2xl font-display font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-accent">Dysphono</span>
                </a>
            </div>
            <h1 class="text-2xl font-display font-bold mb-2">Créer un compte</h1>
            <p class="text-slate-500 mb-6">Entrez vos identifiants pour commencer.</p>

            <form id="registerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                    <input type="email" id="email" required class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Mot de passe</label>
                    <input type="password" id="password" required class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 outline-none">
                </div>
                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all">
                    S’inscrire
                </button>
            </form>
            <p class="text-center mt-6 text-sm">
                Déjà un compte ? <a href="login.html" class="text-primary-600 font-bold">Se connecter</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcFIFS6-uhHlxtlZUUrnWZerQr84NlIGs",
            authDomain: "dysphono.firebaseapp.com",
            projectId: "dysphono",
            storageBucket: "dysphono.firebasestorage.app",
            messagingSenderId: "420960702605",
            appId: "1:420960702605:web:2c5ba910bb93789b5c92c4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('registerForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = "Création en cours...";

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                // Inscription réussie : rediriger vers onboarding pour compléter le profil
                window.location.href = 'onboarding.html';
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = "Cet email est déjà utilisé.";
                else if (error.code === 'auth/weak-password') msg = "Mot de passe trop faible (6 caractères minimum).";
                alert("Erreur : " + msg);
                btn.disabled = false;
                btn.innerText = "S’inscrire";
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
