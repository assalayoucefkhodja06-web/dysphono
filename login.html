<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Dysphono</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full">
        <div class="glass p-8 rounded-[2.5rem] shadow-2xl border border-white/50">
            <div class="flex flex-col items-center mb-6">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="p-2 bg-blue-600 rounded-xl">
                        <i data-lucide="mic-2" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="text-2xl font-display font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Dysphono</span>
                </a>
            </div>
            <h1 class="text-2xl font-display font-bold mb-2">Connexion</h1>
            <p class="text-slate-500 mb-6">Connectez-vous pour continuer</p>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                    <input type="email" id="email" required class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Mot de passe</label>
                    <input type="password" id="password" required class="w-full px-5 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all">
                    Se connecter
                </button>
            </form>

            <p class="text-center mt-6 text-sm text-slate-600">
                Pas encore de compte ?
                <a href="register.html" class="text-blue-600 font-bold hover:underline">Créer un compte</a>
            </p>

            <div class="mt-8 text-center">
                <a href="index.html" class="text-slate-400 text-sm hover:text-slate-600">← Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcFIFS6-uhHlxtlZUUrnWZerQr84NlIGs",
            authDomain: "dysphono.firebaseapp.com",
            projectId: "dysphono",
            storageBucket: "dysphono.firebasestorage.app",
            messagingSenderId: "420960702605",
            appId: "1:420960702605:web:2c5ba910bb93789b5c92c4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "Connexion...";
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                let message = "Identifiants incorrects.";
                if (error.code === 'auth/user-not-found') message = "Aucun compte avec cet email.";
                else if (error.code === 'auth/wrong-password') message = "Mot de passe incorrect.";
                alert(message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
